name: Plum
description: >-
  Plum is a UK-based personal finance "money app" that helps consumers save and
  invest automatically. Its mobile app pairs automated savings algorithms (eight
  saving automations) with a range of regulated products including Easy Access
  Savings, a Cash ISA, a 95-day Notice Account, a money-market Interest pocket,
  a Stocks & Shares ISA, a Self-Invested Personal Pension (SIPP), and access to
  thousands of stocks and funds. Plum operates under FCA oversight through
  multiple entities covering payment services, e-money, investment broking, and
  account information services, and monetizes via subscription tiers (Basic,
  Plus, Boost, Max). It is a consumer-facing product with no public developer
  API; this profile was surfaced as a portfolio company of 500 Global and
  Partech and enriched by the API Evangelist pipeline.
